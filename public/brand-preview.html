<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Settlbox brand assets</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#f5f7fb;color:#172133;font:16px Arial,Helvetica,sans-serif}main{max-width:1000px;margin:48px auto;padding:24px}h1{margin-top:0}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}.sample{padding:24px;border:1px solid #e2e6ef;border-radius:16px;background:white;min-height:220px}.sample h2{font-size:15px;font-weight:500;color:#667085}.logo{width:80px;height:80px}.wordmark{width:180px;height:auto}.dark{background:#172133;color:white}.dark h2{color:#cbd5e1}.watermark{background:white url('/card/background.svg') no-repeat right center;background-size:auto 100%;overflow:hidden}.number{font-size:36px;font-weight:600}.loader{width:128px;height:128px}.coin{width:140px;height:140px}.backdrop{background:#1855f4;overflow:hidden}.backdrop img{width:100%;height:140px;object-fit:contain}p{line-height:1.5;color:#667085}
  </style>
</head>
<body>
  <main>
    <h1>Settlbox brand assets</h1>
    <p>Logo, wordmarks, decorative watermark, wallet illustration, and animated loading indicator.</p>
    <section>
      <article class="sample"><h2>Arc · light surface</h2><img class="logo" src="/logo/arc-network-icon-light.svg" alt="Arc"></article>
      <article class="sample dark"><h2>Arc · dark surface</h2><img class="logo" src="/logo/arc-network-icon-dark.svg" alt="Arc"></article>
      <article class="sample"><h2>Settlement currency · USDC</h2><img class="logo" src="/token/usdc.svg" alt="USDC"></article>
      <article class="sample"><h2>App icon</h2><img class="logo" src="/logo/settlbox-icon.svg" alt="Settlbox symbol"></article>
      <article class="sample"><h2>Wordmark</h2><img class="wordmark" src="/settlbox-logo.svg" alt="Settlbox"></article>
      <article class="sample dark"><h2>Dark surface</h2><img class="wordmark" src="/logo/settlbox-light.svg" alt="Settlbox"></article>
      <article class="sample watermark"><h2>All invoices</h2><span class="number">2</span></article>
      <article class="sample"><h2>Loading</h2><picture><source media="(prefers-reduced-motion: reduce)" srcset="/logo/settlbox-icon.svg"><img class="loader" src="/logo/loading.gif" alt="Loading Settlbox"></picture></article>
      <article class="sample"><h2>Wallet illustration</h2><img class="coin" src="/logo/3d-settlbox-coin.svg" alt="Settlbox medallion"></article>
      <article class="sample backdrop"><img src="/gift/background-settlbox-text.svg" alt="Decorative Settlbox wordmark"></article>
    </section>
  </main>
</body>
</html>
